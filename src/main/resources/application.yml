spring:
  application:
    name: car-marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carmarketplace}
    username: ${DB_USERNAME:carmarketplace}
    password: ${DB_PASSWORD:carmarketplace}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
